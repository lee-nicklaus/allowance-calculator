<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零花钱计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-container">
        <input type="date" id="date-picker">
        <span id="week-number-display"></span>
    </div>

    <h1>本周可奖励零花钱</h1>
    <div id="money-container">
        <span id="money">100</span> RMB
    </div>

    <h2>操作记录</h2>
    <table id="history-table">
        <thead>
            <tr>
                <th>日期</th>
                <th>标签</th>
                <th>金额 (RMB)</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- History records will be inserted here by JavaScript -->
        </tbody>
    </table>

    <div class="io-buttons">
        <button id="export-button">导出数据</button>
        <button id="import-button">导入数据</button>
        <input type="file" id="import-file" hidden accept=".json">
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons-container">
        <button id="good-button" class="action-btn good">Good</button>
        <button id="not-good-button" class="action-btn bad">Not Good</button>
    </div>

    <!-- Labels Modal -->
    <div id="labels-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div id="modal-labels-container"></div>
            <button id="modal-close-button">关闭</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
